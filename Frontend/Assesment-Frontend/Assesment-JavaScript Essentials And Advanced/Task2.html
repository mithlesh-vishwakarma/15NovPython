<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2</title>
  </head>
  <body>
    <script>
      function fetchTopMovies() {
        return fetch("https://jsonplaceholder.typicode.com/albums")
          .then((response) => {
            if (!response.ok) {
              throw new Error("failed to fetch data");
            }
            return response.json();
          })
          .then((data) => {
            const titles = data.map((album) => album.title).slice(0, 5);
            return titles;
          })
          .then((response) => {
            console.log(response);
          })
          .catch((err) => {
            console.log(err);
          });
      }

      fetchTopMovies();
    </script>
  </body>
</html>
