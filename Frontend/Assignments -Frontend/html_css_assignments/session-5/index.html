<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 5 - CSS Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="product-card">
        <h2 class="product-title">Wireless Headphones</h2>
        <p>Premium sound and comfort.</p>
        <button>Buy Now</button>
    </div>

    <div class="offer-banner">
        <h3>Flat 50% Off on Summer Collection</h3>
    </div>

    <div class="card">
        <h3>Spotify Playlist</h3>
        <div class="playlist-item">Song 1</div>
        <div class="playlist-item" id="now-playing">Song 2 - Now Playing</div>
        <div class="playlist-item">Song 3</div>
    </div>

    <div class="card">
        <h3>BookMyShow Movie</h3>
        <p>Interstellar</p>
        <button onclick="toggleMode()">Toggle Light/Dark Mode</button>
    </div>

    <script>
        function toggleMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
