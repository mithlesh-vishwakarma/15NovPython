<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 10 - Bootstrap Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-box">
        <section class="section">
            <h2>1. Navbar</h2>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container">
                    <a class="navbar-brand" href="#">BeatHub</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navMenu">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">Playlists</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </section>

        <section class="section">
            <h2>2. Product Card</h2>
            <div class="card card-custom">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h5 class="card-title">Wireless Headphones</h5>
                    <p class="card-text">Great sound and long battery life.</p>
                    <p class="price">$89</p>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </section>

        <section class="section">
            <h2>3. Carousel</h2>
            <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=80" class="d-block w-100" alt="Movie 1">
                        <div class="carousel-caption">
                            <h5>Interstellar</h5>
                            <p>Epic space adventure</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1517602302552-471fe67acf66?auto=format&fit=crop&w=900&q=80" class="d-block w-100" alt="Movie 2">
                        <div class="carousel-caption">
                            <h5>Inception</h5>
                            <p>Mind-bending thriller</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=80" class="d-block w-100" alt="Movie 3">
                        <div class="carousel-caption">
                            <h5>Joker</h5>
                            <p>Dark and gripping drama</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <h2>4. Review Form</h2>
            <form class="form-box">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" placeholder="Your name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Rating</label>
                    <select class="form-select">
                        <option>1 Star</option>
                        <option>2 Stars</option>
                        <option>3 Stars</option>
                        <option>4 Stars</option>
                        <option selected>5 Stars</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Review</label>
                    <textarea class="form-control" rows="4" placeholder="Write your review here"></textarea>
                </div>
                <button type="submit" class="btn btn-danger">Submit</button>
            </form>
        </section>

        <section class="section">
            <h2>5. Filter Buttons</h2>
            <div class="btn-group flex-wrap" role="group">
                <button type="button" class="btn btn-outline-danger active">All</button>
                <button type="button" class="btn btn-outline-danger">Veg</button>
                <button type="button" class="btn btn-outline-danger">Non-Veg</button>
                <button type="button" class="btn btn-outline-danger">Desserts</button>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
