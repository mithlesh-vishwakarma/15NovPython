<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 7 - Clear Favorites</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background-color: #f5f5f5;
      }
      .container {
        background-color: white;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      button {
        padding: 10px 20px;
        margin: 10px 5px 10px 0;
        font-size: 14px;
        background-color: #d32f2f;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #b71c1c;
      }
      .add-button {
        background-color: #ff6b35;
      }
      .add-button:hover {
        background-color: #e55a2b;
      }
      input {
        padding: 10px;
        margin: 5px;
        font-size: 14px;
        width: 200px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background-color: #f9f9f9;
        padding: 10px;
        margin: 5px 0;
        border-left: 4px solid #ff6b35;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Task 7: Clear Favorites Button</h1>
      <p>
        Question: Implement a 'Clear Favorites' button on your restaurant list
        page that removes the saved data from localStorage using
        localStorage.removeItem() and updates the UI accordingly.
      </p>

      <input type="text" id="favInput" placeholder="Enter restaurant name" />
      <button class="add-button" onclick="addFavorite()">Add Favorite</button>
      <button onclick="clearFavorites()">Clear Favorites</button>

      <h3>My Favorite Restaurants:</h3>
      <ul id="favoritesList"></ul>
      <p id="message" style="color: #666"></p>
    </div>

    <script>
      const FAV_KEY = "myFavorites";

      function addFavorite() {
        const input = document.getElementById("favInput");
        const restaurant = input.value.trim();

        if (restaurant === "") {
          alert("Please enter a restaurant name");
          return;
        }

        let favorites = localStorage.getItem(FAV_KEY);
        if (favorites === null) {
          favorites = [];
        } else {
          favorites = JSON.parse(favorites);
        }

        favorites.push(restaurant);
        localStorage.setItem(FAV_KEY, JSON.stringify(favorites));

        input.value = "";
        displayFavorites();
      }

      function displayFavorites() {
        const list = document.getElementById("favoritesList");
        const message = document.getElementById("message");
        list.innerHTML = "";

        const favorites = localStorage.getItem(FAV_KEY);
        if (favorites === null || JSON.parse(favorites).length === 0) {
          message.textContent = "No favorites saved yet";
          return;
        }

        const restaurantList = JSON.parse(favorites);
        message.textContent = "";
        restaurantList.forEach((restaurant, index) => {
          const li = document.createElement("li");
          li.textContent = index + 1 + ". " + restaurant;
          list.appendChild(li);
        });
      }

      function clearFavorites() {
        if (
          confirm(
            "Are you sure you want to clear all favorites? This action cannot be undone.",
          )
        ) {
          // Remove from localStorage using localStorage.removeItem()
          localStorage.removeItem(FAV_KEY);

          // Update the UI immediately
          displayFavorites();
          document.getElementById("message").textContent =
            "All favorites have been cleared!";
          console.log("Favorites cleared from localStorage");
        }
      }

      // Load on page load
      window.onload = displayFavorites;
    </script>
  </body>
</html>
