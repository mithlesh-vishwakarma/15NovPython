<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 7</title>
  </head>
  <body>
    <script>
      const products = [
        { id: 1, name: "iPhone 15", price: 70000 },
        { id: 2, name: "Samsung Galaxy S24", price: 65000 },
        { id: 3, name: "iPhone 14", price: 60000 },
        { id: 4, name: "OnePlus 12", price: 55000 },
        { id: 5, name: "Google Pixel 8", price: 50000 },
      ];

      function searchProducts(products, searchTerm, callback) {
        setTimeout(() => {
          const result = products.filter((product) =>
            product.name.toLowerCase().includes(searchTerm.toLowerCase()),
          );

          callback(result);
        }, 1000);
      }

      searchProducts(products, "O", (result) => {
        console.log("Callback Result:");
        console.log(result);
      });
    </script>
  </body>
</html>
