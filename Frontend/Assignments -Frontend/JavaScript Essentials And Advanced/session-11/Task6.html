<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>Task 6</title>

  <body>
    <script>
      function getOrderStatus(orderId) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (orderId % 2 == 0) {
              resolve("Order delivered");
            } else {
              reject("order not found");
            }
          }, 1500);
        });
      }

      getOrderStatus(3)
        .then((result) => {
          console.log(result);
        })
        .catch((err) => {
          console.log(err);
        });
    </script>
  </body>
</html>
