  <body>
    <script>
      function makePayment() {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            console.log("Payment successful!");
            resolve();
          }, 1000);
        });
      }

      makePayment().then(() => {
        console.log("Payment process completed.");
      });
    </script>
  </body>
