    <script>
      function fetchSongLyrics(song, callback) {
        setTimeout(() => {
          callback(`lyrics of the song ${song}`);
        }, 3000);
      }

      fetchSongLyrics("mai aisa kyu hoon", (lyrics) => {
        console.log(lyrics);
      });
    </script>
