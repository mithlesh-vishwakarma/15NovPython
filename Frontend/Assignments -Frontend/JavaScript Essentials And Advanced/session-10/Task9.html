    <script>
      const addToCartArrow = (...prices) => {
        let total = 0;
        for (let i = 0; i < prices.length; i++) {
          total += prices[i];
        }
        return total;
      };
      console.log(addToCartArrow(12, 34, 32, 33, 2222, 1111, 1000000));
