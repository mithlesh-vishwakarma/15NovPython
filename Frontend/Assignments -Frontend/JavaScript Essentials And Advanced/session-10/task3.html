  <script>
    const data = `[
        {"name": "CodeWithHarry"},
        {"name": "Apna College"},
        {"name": "freeCodeCamp"}
      ]`;
    function favYtChannel(jsonstring) {
      const channels = JSON.parse(jsonstring);
      const channelNames = channels.map((channels) => channels.name);
      return channelNames;
    }

    console.log(favYtChannel(data));
  </script>
