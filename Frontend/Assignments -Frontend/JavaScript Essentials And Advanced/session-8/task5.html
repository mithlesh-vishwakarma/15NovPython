<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const cart = [
        {
          productName: "Laptop",
          price: 50000,
          quantity: 1,
        },
        {
          productName: "Headphones",
          price: 2000,
          quantity: 2,
        },
        {
          productName: "Keyboard",
          price: 1500,
          quantity: 3,
        },
        {
          productName: "Mouse",
          price: 800,
          quantity: 2,
        },
      ];

      for (let product of cart) {
        const totalPrice = product.price * product.quantity;

        console.log(product.productName + " - Total Price: ₹" + totalPrice);
      }
    </script>
  </body>
</html>
