<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies</title>

    <style>
      .movie {
        margin: 10px;
        padding: 15px;
        width: 200px;
        border: 1px solid black;
      }

      button {
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <h2>Movies</h2>
    <div class="movie">
      <h3>Inception</h3>
      <button class="removeBtn">Remove</button>
    </div>

    <div class="movie">
      <h3>Interstellar</h3>
      <button class="removeBtn">Remove</button>
    </div>

    <div class="movie">
      <h3>Avengers: Endgame</h3>
      <button class="removeBtn">Remove</button>
    </div>

    <script>
      const buttons = document.querySelectorAll(".removeBtn");

      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          const movieCard = button.parentElement;

          movieCard.remove();
        });
      });
    </script>
  </body>
</html>
